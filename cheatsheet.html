<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Panel cheat sheet for the Tallent Edition, an unofficial firmware extension for the Moog Subharmonicon: entering Settings Mode, choosing a setting and reading its value.">
<meta name="theme-color" content="#fafaf8">
<title>Subharmonicon Tallent Edition: Cheat Sheet</title>
<style>
:root { color-scheme:light; --paper:#fafaf8; --ink:#202523; --muted:#535d57; --line:#d4d9d4; --accent:#285d48; }
* { box-sizing:border-box; }
body { margin:0; background:var(--paper); color:var(--ink); font:1rem/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
.sheet { max-width:62rem; margin:0 auto; padding:clamp(1.5rem,5vw,3rem) 1.25rem 3rem; }
a { color:var(--accent); text-underline-offset:.2em; }
a:focus-visible { outline:3px solid var(--accent); outline-offset:4px; }
header { display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:.75rem 2rem; padding-bottom:1.25rem; border-bottom:1px solid var(--line); }
header .kind { margin:0 0 .35rem; color:var(--muted); font-weight:600; }
h1 { margin:0; font-size:clamp(1.6rem,4vw,2.1rem); line-height:1.12; letter-spacing:-.035em; font-weight:650; }
header .about { max-width:24rem; margin:0; color:var(--muted); font-size:.875rem; }
h2 { margin:2rem 0 1rem; font-size:1.125rem; font-weight:650; }
figure { margin:0; break-inside:avoid; }
figcaption { margin-bottom:.45rem; font-weight:650; }
figure p { margin:.45rem 0 0; color:var(--muted); font-size:.875rem; }
figure svg.pn { width:100%; }
/* Panel drawings, shared by the guide and the panel cheat sheet. Lit LEDs and
   buttons, and the notes on what a control does here, are in the accent
   colour. */
svg.pn { display:block; max-width:100%; height:auto; }
.pn .fr { fill:#fff; stroke:var(--line); stroke-width:.7; }
.pn .l, .pn .ld, .pn .la { fill:none; stroke:var(--ink); stroke-width:.7; }
.pn .ld { stroke:var(--line); stroke-dasharray:2 2.5; }
.pn .la { stroke:var(--accent); }
.pn .off, .pn .in { fill:#fff; stroke:var(--ink); stroke-width:.7; }
.pn .hot { fill:#e3ede7; stroke:var(--accent); stroke-width:1.5; }
.pn .on { fill:var(--accent); stroke:var(--accent); stroke-width:.7; }
.pn .cap { fill:#fff; stroke:var(--ink); }
.pn .ptr { fill:none; stroke:var(--ink); stroke-width:1.5; stroke-linecap:round; }
.pn .wave { fill:none; stroke:var(--accent); stroke-width:1.2; stroke-linejoin:round; }
.pn text { font:700 7px "DIN Condensed","Avenir Next Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif; letter-spacing:.05em; fill:var(--ink); text-anchor:middle; }
.pn text.s { text-anchor:start; }
.pn text.e { text-anchor:end; }
.pn .lt { fill:#fff; }
.pn .an { fill:var(--accent); font-size:7.6px; }
.pn .an2 { fill:var(--muted); font:500 6.4px system-ui,sans-serif; letter-spacing:0; }
.pn .in-knob { font-size:10px; }

/* Four steps, each drawing at the same scale: the two wide ones are 372
   panel units across and the two narrow ones 214. */
.steps { display:grid; grid-template-columns:214fr 158fr 214fr; gap:1.5rem; }
.steps figure:nth-child(1) { grid-column:1; }
.steps figure:nth-child(2) { grid-column:2 / 4; }
.steps figure:nth-child(3) { grid-column:1 / 3; }
.steps figure:nth-child(4) { grid-column:3; }
figcaption b { display:inline-block; width:1.5rem; height:1.5rem; margin-right:.4rem; border-radius:50%; background:var(--accent); color:#fff; font-size:.875rem; line-height:1.5rem; text-align:center; print-color-adjust:exact; -webkit-print-color-adjust:exact; }
.cards { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:1.5rem; align-items:start; }
footer { margin-top:2.5rem; padding-top:1.25rem; border-top:1px solid var(--line); color:var(--muted); font-size:.875rem; }
footer p { margin:0 0 .4rem; }

@media (max-width:52rem) {
  .cards { grid-template-columns:repeat(2,minmax(0,1fr)); }
}
@media (max-width:40rem) {
  .steps, .cards { grid-template-columns:1fr; }
  .steps figure:nth-child(n) { grid-column:1; overflow-x:auto; }
  .steps figure:nth-child(2) svg.pn, .steps figure:nth-child(3) svg.pn { min-width:31rem; }
  .steps figure:nth-child(1) svg.pn, .steps figure:nth-child(4) svg.pn { max-width:22rem; }
}
@media print {
  html { font-size:8.6pt; }
  body { background:none; }
  .sheet { max-width:none; padding:0; }
  .steps { gap:1rem 1.25rem; }
  .cards { grid-template-columns:repeat(3,minmax(0,1fr)); gap:1rem 1.25rem; }
  h2 { margin:1.1rem 0 .6rem; }
  a { color:inherit; text-decoration:none; }
  svg { print-color-adjust:exact; -webkit-print-color-adjust:exact; }
  footer { margin-top:1.25rem; padding-top:.75rem; }
  @page { margin:12mm 13mm; }
}
</style>
</head>
<body>
<div class="sheet">
<header>
<div>
<p class="kind">Cheat Sheet</p>
<h1>Subharmonicon Tallent Edition</h1>
</div>
<p class="about">Settings Mode on one page. The <a href="https://brandon-tallent.github.io/subharmonicon-extended-firmware/manual.html">New Features Guide</a> explains what each setting does.</p>
</header>

<main>
<h2>Settings Mode</h2>
<div class="steps">
<figure><figcaption><b>1</b>Enter</figcaption><svg class="pn" viewBox="0 0 214 80" width="364" height="136" role="img" aria-label="With PLAY unlit, hold the SEQ 1 ASSIGN SUB 1 and SUB 2 buttons for one second"><rect class="fr" x=".5" y=".5" width="213" height="79" rx="3"/><rect class="off" x="10" y="28" width="40" height="20" rx="3"/><rect class="in" x="12.6" y="30.6" width="34.8" height="14.8" rx="1.6"/><text x="30" y="40.5">PLAY</text><text x="30" y="61" class="an">UNLIT</text><path class="l" d="M79 21V14H107.4M170.6 14H199V21"/><text x="139" y="16.5">SEQ 1 ASSIGN</text><rect class="off" x="79" y="28" width="30" height="20" rx="3"/><rect class="in" x="81.6" y="30.6" width="24.8" height="14.8" rx="1.6"/><text x="94" y="40.5">OSC 1</text><rect class="hot" x="124" y="28" width="30" height="20" rx="3"/><rect class="in" x="126.6" y="30.6" width="24.8" height="14.8" rx="1.6"/><text x="139" y="40.5">SUB 1</text><rect class="hot" x="169" y="28" width="30" height="20" rx="3"/><rect class="in" x="171.6" y="30.6" width="24.8" height="14.8" rx="1.6"/><text x="184" y="40.5">SUB 2</text><path class="la" d="M124 53v5H199v-5"/><text x="161.5" y="68" class="an">HOLD FOR ONE SECOND</text></svg><p>Stop the sequencers, then hold both buttons for one second.</p></figure>
<figure><figcaption><b>2</b>Select a setting</figcaption><svg class="pn" viewBox="0 0 372 96" width="722" height="186" role="img" aria-label="The buttons that select a setting in Settings Mode"><rect class="fr" x=".5" y=".5" width="371" height="95" rx="3"/><circle class="off" cx="26" cy="28" r="12"/><path class="l" d="M24.3 36.3L23.8 39.3M21.3 35.1L19.6 37.6M18.9 32.7L16.4 34.4M17.7 29.7L14.7 30.2M17.7 26.3L14.7 25.8M18.9 23.3L16.4 21.6M21.3 20.9L19.6 18.4M24.3 19.7L23.8 16.7M27.7 19.7L28.2 16.7M30.7 20.9L32.4 18.4M33.1 23.3L35.6 21.6M34.3 26.3L37.3 25.8M34.3 29.7L37.3 30.2M33.1 32.7L35.6 34.4M30.7 35.1L32.4 37.6M27.7 36.3L28.2 39.3"/><circle class="off" cx="26" cy="28" r="8"/><path class="ptr" d="M26.0 28.0L19.1 24.0"/><text x="26" y="10">RHYTHM 1</text><path class="l" d="M26 40.5v3.5"/><rect class="hot" x="11" y="44" width="30" height="20" rx="3"/><rect class="in" x="13.6" y="46.6" width="24.8" height="14.8" rx="1.6"/><text x="26" y="56.5">SEQ 1</text><rect class="off" x="11" y="68" width="30" height="20" rx="3"/><rect class="in" x="13.6" y="70.6" width="24.8" height="14.8" rx="1.6"/><text x="26" y="80.5">SEQ 2</text><text x="46" y="52.5" class="an s">MIDI</text><text x="46" y="61" class="an s">VCF</text><path class="l" d="M77 29V22H100.4M163.6 22H187V29"/><text x="132" y="24.5">SEQ 1 ASSIGN</text><rect class="hot" x="77" y="36" width="30" height="20" rx="3"/><rect class="in" x="79.6" y="38.6" width="24.8" height="14.8" rx="1.6"/><text x="92" y="48.5">OSC 1</text><text x="92" y="70" class="an">HARMONY</text><text x="92" y="78.5" class="an">SPREAD</text><rect class="hot" x="117" y="36" width="30" height="20" rx="3"/><rect class="in" x="119.6" y="38.6" width="24.8" height="14.8" rx="1.6"/><text x="132" y="48.5">SUB 1</text><text x="132" y="70" class="an">GLIDE</text><rect class="hot" x="157" y="36" width="30" height="20" rx="3"/><rect class="in" x="159.6" y="38.6" width="24.8" height="14.8" rx="1.6"/><text x="172" y="48.5">SUB 2</text><text x="172" y="70" class="an">VELOCITY</text><text x="172" y="78.5" class="an">DEPTH</text><rect class="hot" x="200" y="36" width="44" height="20" rx="3"/><rect class="in" x="202.6" y="38.6" width="38.8" height="14.8" rx="1.6"/><text x="222" y="48.5">QUANTIZE</text><text x="222" y="70" class="an">TUNING</text><text x="222" y="78.5" class="an">SPAN</text><path class="l" d="M257 29V22H280.4M343.6 22H367V29"/><text x="312" y="24.5">SEQ 2 ASSIGN</text><rect class="hot" x="257" y="36" width="30" height="20" rx="3"/><rect class="in" x="259.6" y="38.6" width="24.8" height="14.8" rx="1.6"/><text x="272" y="48.5">OSC 2</text><text x="272" y="70" class="an">PITCH</text><text x="272" y="78.5" class="an">MODE</text><rect class="hot" x="297" y="36" width="30" height="20" rx="3"/><rect class="in" x="299.6" y="38.6" width="24.8" height="14.8" rx="1.6"/><text x="312" y="48.5">SUB 1</text><text x="312" y="70" class="an">RHYTHM</text><text x="312" y="78.5" class="an">TYPE</text><rect class="hot" x="337" y="36" width="30" height="20" rx="3"/><rect class="in" x="339.6" y="38.6" width="24.8" height="14.8" rx="1.6"/><text x="352" y="48.5">SUB 2</text><text x="352" y="70" class="an">NOISE</text></svg><p>Press its button, which then blinks. The other SEQ ASSIGN buttons are lit if their setting is switched on. Harmony Spread is selected when you arrive.</p></figure>
<figure><figcaption><b>3</b>Change it</figcaption><svg class="pn" viewBox="0 0 372 104" width="722" height="202" role="img" aria-label="The buttons and LEDs that edit a setting in Settings Mode"><rect class="fr" x=".5" y=".5" width="371" height="103" rx="3"/><text x="68" y="13">SEQUENCER 1</text><path class="l" d="M19.6 44.4L17.2 46.8M17.0 38.0L13.5 38.0M19.6 31.6L17.2 29.2M26.0 29.0L26.0 25.5M32.4 31.6L34.8 29.2M35.0 38.0L38.5 38.0M32.4 44.4L34.8 46.8"/><circle class="off" cx="26" cy="38" r="7"/><path class="ptr" d="M26.0 38.0L19.4 35.6"/><text x="26" y="22">STEP 1</text><circle class="on" cx="26" cy="58" r="3.6"/><path class="l" d="M47.6 44.4L45.2 46.8M45.0 38.0L41.5 38.0M47.6 31.6L45.2 29.2M54.0 29.0L54.0 25.5M60.4 31.6L62.8 29.2M63.0 38.0L66.5 38.0M60.4 44.4L62.8 46.8"/><circle class="off" cx="54" cy="38" r="7"/><path class="ptr" d="M54.0 38.0L56.4 31.4"/><text x="54" y="22">STEP 2</text><circle class="on" cx="54" cy="58" r="3.6"/><path class="l" d="M75.6 44.4L73.2 46.8M73.0 38.0L69.5 38.0M75.6 31.6L73.2 29.2M82.0 29.0L82.0 25.5M88.4 31.6L90.8 29.2M91.0 38.0L94.5 38.0M88.4 44.4L90.8 46.8"/><circle class="off" cx="82" cy="38" r="7"/><path class="ptr" d="M82.0 38.0L78.5 31.9"/><text x="82" y="22">STEP 3</text><circle class="off" cx="82" cy="58" r="3.6"/><path class="l" d="M103.6 44.4L101.2 46.8M101.0 38.0L97.5 38.0M103.6 31.6L101.2 29.2M110.0 29.0L110.0 25.5M116.4 31.6L118.8 29.2M119.0 38.0L122.5 38.0M116.4 44.4L118.8 46.8"/><circle class="off" cx="110" cy="38" r="7"/><path class="ptr" d="M110.0 38.0L116.1 34.5"/><text x="110" y="22">STEP 4</text><circle class="off" cx="110" cy="58" r="3.6"/><path class="la" d="M18 66v5H118v-5"/><text x="68" y="81" class="an">VALUE</text><text x="68" y="89" class="an2">more LEDs, more of it</text><rect class="hot" x="155" y="30" width="30" height="20" rx="3"/><rect class="in" x="157.6" y="32.6" width="24.8" height="14.8" rx="1.6"/><text x="170" y="42.5">RESET</text><text x="170" y="21" class="an">LOWER</text><rect class="hot" x="193" y="30" width="30" height="20" rx="3"/><rect class="in" x="195.6" y="32.6" width="24.8" height="14.8" rx="1.6"/><text x="208" y="42.5">EG</text><text x="208" y="21" class="an">ON / OFF</text><rect class="hot" x="231" y="30" width="30" height="20" rx="3"/><rect class="in" x="233.6" y="32.6" width="24.8" height="14.8" rx="1.6"/><text x="246" y="42.5">NEXT</text><text x="246" y="21" class="an">RAISE</text><rect class="hot" x="164" y="58" width="40" height="20" rx="3"/><rect class="in" x="166.6" y="60.6" width="34.8" height="14.8" rx="1.6"/><text x="184" y="70.5">PLAY</text><rect class="off" x="212" y="58" width="40" height="20" rx="3"/><rect class="in" x="214.6" y="60.6" width="34.8" height="14.8" rx="1.6"/><text x="232" y="70.5">TRIGGER</text><text x="184" y="91" class="an">SAVE AND EXIT</text><circle class="off" cx="302" cy="18" r="3.6"/><text x="310" y="20.5" class="s">±5</text><circle class="on" cx="302" cy="33" r="3.6"/><text x="310" y="35.5" class="s">±2</text><text x="326" y="35.5" class="an s">COARSE</text><circle class="off" cx="302" cy="48" r="3.6"/><text x="310" y="50.5" class="s">±1</text><text x="326" y="50.5" class="an s">FINE</text><rect class="hot" x="290" y="66" width="40" height="20" rx="3"/><rect class="in" x="292.6" y="68.6" width="34.8" height="14.8" rx="1.6"/><text x="310" y="78.5">SEQ OCT</text></svg><p>The STEP LEDs of Sequencer 1 show the value.</p></figure>
<figure><figcaption><b>4</b>Leave</figcaption><svg class="pn" viewBox="0 0 214 80" width="364" height="136" role="img" aria-label="PLAY saves the settings and leaves Settings Mode"><rect class="fr" x=".5" y=".5" width="213" height="79" rx="3"/><rect class="hot" x="42" y="24" width="40" height="20" rx="3"/><rect class="in" x="44.6" y="26.6" width="34.8" height="14.8" rx="1.6"/><text x="62" y="36.5">PLAY</text><text x="62" y="58" class="an">SAVE AND EXIT</text><text x="104" y="30" class="an s">OR WAIT</text><text x="104" y="38.5" class="an s">30 SECONDS</text></svg><p>Your settings are saved. PLAY doesn’t start the sequencers.</p></figure>
</div>

<h2>The Settings</h2>
<div class="cards">
<figure><figcaption>Pitch Mode</figcaption><svg class="pn" viewBox="0 0 186 74" width="353" height="141" role="img" aria-label="Pitch Mode: the STEP LEDs for each mode"><rect class="fr" x=".5" y=".5" width="185" height="73" rx="3"/><text x="40" y="23">SEQ 2 ASSIGN</text><rect class="hot" x="24" y="31" width="32" height="20" rx="3"/><rect class="in" x="26.6" y="33.6" width="26.8" height="14.8" rx="1.6"/><text x="40" y="43.5">OSC 2</text><circle class="off" cx="88" cy="17.5" r="3.6"/><circle class="off" cx="100" cy="17.5" r="3.6"/><circle class="off" cx="112" cy="17.5" r="3.6"/><circle class="off" cx="124" cy="17.5" r="3.6"/><text x="136" y="20.1" class="an s">NORMAL</text><circle class="on" cx="88" cy="30.5" r="3.6"/><circle class="off" cx="100" cy="30.5" r="3.6"/><circle class="off" cx="112" cy="30.5" r="3.6"/><circle class="off" cx="124" cy="30.5" r="3.6"/><text x="136" y="33.1" class="an s">PARAPHONIC</text><circle class="on" cx="88" cy="43.5" r="3.6"/><circle class="on" cx="100" cy="43.5" r="3.6"/><circle class="off" cx="112" cy="43.5" r="3.6"/><circle class="off" cx="124" cy="43.5" r="3.6"/><text x="136" y="46.1" class="an s">HARMONY</text><circle class="on" cx="88" cy="56.5" r="3.6"/><circle class="on" cx="100" cy="56.5" r="3.6"/><circle class="on" cx="112" cy="56.5" r="3.6"/><circle class="off" cx="124" cy="56.5" r="3.6"/><text x="136" y="59.1" class="an s">MORPH</text></svg><p>EG steps to the next mode. NEXT and RESET step forward and back.</p></figure>
<figure><figcaption>Rhythm Type</figcaption><svg class="pn" viewBox="0 0 186 60" width="353" height="114" role="img" aria-label="Rhythm Type: the STEP LEDs for each type"><rect class="fr" x=".5" y=".5" width="185" height="59" rx="3"/><text x="40" y="16">SEQ 2 ASSIGN</text><rect class="hot" x="24" y="24" width="32" height="20" rx="3"/><rect class="in" x="26.6" y="26.6" width="26.8" height="14.8" rx="1.6"/><text x="40" y="36.5">SUB 1</text><circle class="off" cx="88" cy="23.5" r="3.6"/><circle class="off" cx="100" cy="23.5" r="3.6"/><circle class="off" cx="112" cy="23.5" r="3.6"/><circle class="off" cx="124" cy="23.5" r="3.6"/><text x="136" y="26.1" class="an s">STOCK</text><circle class="on" cx="88" cy="36.5" r="3.6"/><circle class="on" cx="100" cy="36.5" r="3.6"/><circle class="on" cx="112" cy="36.5" r="3.6"/><circle class="on" cx="124" cy="36.5" r="3.6"/><text x="136" y="39.1" class="an s">GATE PATTERNS</text></svg><p>EG switches. NEXT selects Gate Patterns, RESET selects Stock.</p></figure>
<figure><figcaption>Noise, MIDI VCF</figcaption><svg class="pn" viewBox="0 0 186 94" width="353" height="179" role="img" aria-label="Noise and MIDI VCF: the STEP LEDs when on and off"><rect class="fr" x=".5" y=".5" width="185" height="93" rx="3"/><text x="40" y="13">SEQ 2 ASSIGN</text><rect class="hot" x="24" y="21" width="32" height="20" rx="3"/><rect class="in" x="26.6" y="23.6" width="26.8" height="14.8" rx="1.6"/><text x="40" y="33.5">SUB 2</text><text x="40" y="53">RHYTHM 1</text><rect class="hot" x="24" y="61" width="32" height="20" rx="3"/><rect class="in" x="26.6" y="63.6" width="26.8" height="14.8" rx="1.6"/><text x="40" y="73.5">SEQ 1</text><circle class="on" cx="88" cy="40.5" r="3.6"/><circle class="on" cx="100" cy="40.5" r="3.6"/><circle class="on" cx="112" cy="40.5" r="3.6"/><circle class="on" cx="124" cy="40.5" r="3.6"/><text x="136" y="43.1" class="an s">ON</text><circle class="off" cx="88" cy="53.5" r="3.6"/><circle class="off" cx="100" cy="53.5" r="3.6"/><circle class="off" cx="112" cy="53.5" r="3.6"/><circle class="off" cx="124" cy="53.5" r="3.6"/><text x="136" y="56.1" class="an s">OFF</text></svg><p>SUB 2 selects Noise and SEQ 1 selects MIDI VCF. EG switches. NEXT is on, RESET is off.</p></figure>
<figure><figcaption>Tuning Span</figcaption><svg class="pn" viewBox="0 0 186 60" width="353" height="114" role="img" aria-label="Tuning Span: the STEP LEDs for each span"><rect class="fr" x=".5" y=".5" width="185" height="59" rx="3"/><rect class="hot" x="17" y="20" width="46" height="20" rx="3"/><rect class="in" x="19.6" y="22.6" width="40.8" height="14.8" rx="1.6"/><text x="40" y="32.5">QUANTIZE</text><circle class="on" cx="88" cy="23.5" r="3.6"/><circle class="on" cx="100" cy="23.5" r="3.6"/><circle class="on" cx="112" cy="23.5" r="3.6"/><circle class="on" cx="124" cy="23.5" r="3.6"/><text x="136" y="26.1" class="an s">±2 OCTAVES</text><circle class="on" cx="88" cy="36.5" r="3.6"/><circle class="off" cx="100" cy="36.5" r="3.6"/><circle class="off" cx="112" cy="36.5" r="3.6"/><circle class="off" cx="124" cy="36.5" r="3.6"/><text x="136" y="39.1" class="an s">±1 OCTAVE</text></svg><p>The four QUANTIZE LEDs blink. EG switches. NEXT is ±2, RESET is ±1.</p></figure>
<figure><figcaption>Glide</figcaption><svg class="pn" viewBox="0 0 186 92" width="353" height="175" role="img" aria-label="Glide: the eight STEP LEDs show the time, from 10 to 2000 milliseconds"><rect class="fr" x=".5" y=".5" width="185" height="91" rx="3"/><text x="40" y="32">SEQ 1 ASSIGN</text><rect class="hot" x="25" y="40" width="30" height="20" rx="3"/><rect class="in" x="27.6" y="42.6" width="24.8" height="14.8" rx="1.6"/><text x="40" y="52.5">SUB 1</text><text x="124" y="13">SEQUENCER 1</text><circle class="on" cx="88" cy="24" r="3.6"/><text x="88" y="36" class="an">10</text><circle class="on" cx="112" cy="24" r="3.6"/><text x="112" y="36" class="an">22</text><circle class="off" cx="136" cy="24" r="3.6"/><text x="136" y="36" class="an">50</text><circle class="off" cx="160" cy="24" r="3.6"/><text x="160" y="36" class="an">100</text><text x="124" y="51">SEQUENCER 2</text><circle class="off" cx="88" cy="62" r="3.6"/><text x="88" y="74" class="an">200</text><circle class="off" cx="112" cy="62" r="3.6"/><text x="112" y="74" class="an">500</text><circle class="off" cx="136" cy="62" r="3.6"/><text x="136" y="74" class="an">1000</text><circle class="off" cx="160" cy="62" r="3.6"/><text x="160" y="74" class="an">2000</text></svg><p>Time in milliseconds, on all eight STEP LEDs. NEXT is longer, RESET is shorter. EG switches Glide on and off, and is lit when it’s on.</p></figure>
<figure><figcaption>Harmony Spread, Velocity Depth</figcaption><svg class="pn" viewBox="0 0 186 94" width="353" height="179" role="img" aria-label="Harmony Spread and Velocity Depth: the STEP LEDs for each amount"><rect class="fr" x=".5" y=".5" width="185" height="93" rx="3"/><text x="40" y="13">SEQ 1 ASSIGN</text><rect class="hot" x="24" y="21" width="32" height="20" rx="3"/><rect class="in" x="26.6" y="23.6" width="26.8" height="14.8" rx="1.6"/><text x="40" y="33.5">OSC 1</text><text x="40" y="53">SEQ 1 ASSIGN</text><rect class="hot" x="24" y="61" width="32" height="20" rx="3"/><rect class="in" x="26.6" y="63.6" width="26.8" height="14.8" rx="1.6"/><text x="40" y="73.5">SUB 2</text><circle class="off" cx="88" cy="21" r="3.6"/><circle class="off" cx="100" cy="21" r="3.6"/><circle class="off" cx="112" cy="21" r="3.6"/><circle class="off" cx="124" cy="21" r="3.6"/><text x="136" y="23.6" class="an s">ZERO</text><circle class="on" cx="88" cy="34" r="3.6"/><circle class="off" cx="100" cy="34" r="3.6"/><circle class="off" cx="112" cy="34" r="3.6"/><circle class="off" cx="124" cy="34" r="3.6"/><text x="136" y="36.6" class="an s">1 TO 32</text><circle class="on" cx="88" cy="47" r="3.6"/><circle class="on" cx="100" cy="47" r="3.6"/><circle class="off" cx="112" cy="47" r="3.6"/><circle class="off" cx="124" cy="47" r="3.6"/><text x="136" y="49.6" class="an s">33 TO 64</text><circle class="on" cx="88" cy="60" r="3.6"/><circle class="on" cx="100" cy="60" r="3.6"/><circle class="on" cx="112" cy="60" r="3.6"/><circle class="off" cx="124" cy="60" r="3.6"/><text x="136" y="62.6" class="an s">65 TO 96</text><circle class="on" cx="88" cy="73" r="3.6"/><circle class="on" cx="100" cy="73" r="3.6"/><circle class="on" cx="112" cy="73" r="3.6"/><circle class="on" cx="124" cy="73" r="3.6"/><text x="136" y="75.6" class="an s">97 TO 127</text></svg><p>OSC 1 selects Harmony Spread and SUB 2 selects Velocity Depth. NEXT is more, RESET is less, SEQ OCT is for fine steps. EG switches between zero and your last amount.</p></figure>
